name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # The suite mocks Things (and builds a synthetic Things database), so it
    # runs on Linux; no Mac needed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra test --python ${{ matrix.python-version }}
      - name: Lint
        run: uvx ruff check --isolated --select E4,E7,E9,F src tests
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q
